name: Publish Browser Container Image

run-name: "Browser Image @ ${{ github.ref_name }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

# Application publishing (versioning R17, R18, R19): a person dispatches this
# at a release tag, once release.yml has passed on it, and approves it in the
# `release` environment:
#
#   gh workflow run publish-browser.yml --ref v26.11.0 -f dry_run=false
#
# The image installs the @xynolog/browser package built here from this
# checkout and the SDK release the lock names, downloaded and checked against
# its digest; both take version.json's version, which must be the tag's, and
# `:latest` moves to the image. The launcher runs the image only when this
# workflow, at a release tag, signed its provenance.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + gate but do not push)'
        required: true
        type: boolean

permissions: {}

jobs:
  version:
    name: The release version.json names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: release
        run: scripts/release-version.sh >> "$GITHUB_OUTPUT"

  # This run is at the signed tag v<version>, on a commit main holds.
  tag:
    needs: version
    permissions:
      contents: read
    uses: xynolog/.github/.github/workflows/release-tag.yml@8e5e3b02c34517d3f8b49645330930983d07b7ac
    with:
      tags: ${{ needs.version.outputs.tag }}

  # The lock names released upstreams only, and yields the SDK release's bundle
  # as the artifact `sdk-artifacts`.
  upstream:
    needs: tag
    permissions:
      contents: read
    uses: xynolog/sdk/.github/workflows/upstream.yml@52c59e698b3ee821113f350539f521f6c9df6e1d
    with:
      languages: typescript
      release: true

  publish:
    needs: [version, tag, upstream]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      # The package the image installs, at version.json's version, into
      # .local/browser-package.
      - name: Build the Browser package
        run: bash scripts/build-browser-package.sh "$RUNNER_TEMP/sdk-artifacts"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/image-tags.sh browser "$VERSION" >> "$GITHUB_OUTPUT"

      # Single-platform build for scanning. amd64 OS-package CVEs cover
      # arm64 too since base layers share package versions, so one scan
      # is sufficient. Both builds share the GHA cache; the multi-arch
      # rebuild below is a near-instant cache hit on amd64.
      - name: Build image (amd64, for Trivy scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./browser/Dockerfile
          platforms: linux/amd64
          load: true
          tags: xynolog-browser:scan
          build-args: |
            XYNOLOG_BROWSER_VERSION=${{ needs.version.outputs.version }}
            BROWSER_PACKAGE_DIR=.local/browser-package
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xynolog-browser:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      # Generate the SBOM before push so it gates the publish AND is reused for
      # the attestation below (one SBOM, two uses). Runs on dry-run too: a dry
      # run should exercise every gate, or it proves less than it appears to.
      #
      # Built from the same amd64 image we already scanned. OS packages and
      # language libraries are platform-independent, so the amd64 SBOM
      # accurately describes the multi-arch image's contents.
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xynolog-browser:scan
          format: spdx-json
          output: sbom.spdx.json

      # License-policy gate, matching publish-service-images.yml.
      #
      # Scope note, so this is not read as more than it is: @xynolog/browser
      # ships a PRE-BUILT SPA, so its third-party dependencies are bundled into
      # the output before the package is packed and never appear as npm
      # packages in the image. This inspects the npm packages the SBOM lists:
      # @xynolog/browser itself and the installer-stage scaffold.
      # It is here for symmetry and to catch drift if this image ever gains a
      # real runtime dependency tree -- NOT as assurance about the bundle.
      - name: License policy gate
        run: node .github/scripts/check-licenses.mjs sbom.spdx.json .github/licenses/allowlist.txt .github/licenses/exceptions.txt

      # Boot smoke, module load only. Unlike the service images -- which refuse
      # with the config loader's "No environment selected" and exit -- this CMD
      # is a static server that never exits, so there is no refusal to assert
      # and a bare `docker run` would hang. Surviving a short window IS the
      # signal: a missing entry point or unresolved import dies in milliseconds.
      #
      # Deliberately not a liveness probe: that the server answers correctly on
      # 3000 is e2e's question, not a publish gate's.
      - name: Boot smoke (module load)
        run: |
          set +e
          out=$(timeout 10 docker run --rm xynolog-browser:scan 2>&1)
          rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -qE "Cannot find module|Cannot find package|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND"; then
            echo "::error::browser image died at module load — the entry point or a dependency is missing from the image."
            exit 1
          fi
          # 124 is `timeout` killing a process that was still running: the
          # server came up and stayed up, which is what we are asserting.
          if [ "$rc" -ne 124 ]; then
            echo "::error::browser image exited on its own (status $rc) instead of serving; see the output above."
            exit 1
          fi
          echo "browser: entry point and imports resolved, process stayed up"

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./browser/Dockerfile
          platforms: linux/amd64,linux/arm64
          # `dry_run` is a boolean input. Comparing it to the STRING 'true' coerces
          # both sides to numbers (true → 1, 'true' → NaN), so `!= 'true'` is true
          # for every value and a dry run pushes, unattested. Negate the boolean,
          # as the attest steps do.
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            XYNOLOG_BROWSER_VERSION=${{ needs.version.outputs.version }}
            BROWSER_PACKAGE_DIR=.local/browser-package
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SLSA build provenance via GitHub's OIDC + Sigstore. Stored as an
      # OCI attestation alongside the image in GHCR, signed by this workflow
      # at the ref it runs at; the launcher runs the image only when that ref
      # is a release tag. The Summary step prints the command that verifies it.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Browser Container Image"
            echo ""
            echo "**Version:** $VERSION (built from this commit)"
            echo "**Commit:** ${{ steps.tags.outputs.sha }}"
            echo "**Dry run:** ${{ inputs.dry_run }}"
            echo ""
            echo "### Pull with:"
            echo "\`\`\`bash"
            echo "docker pull $IMAGE:$VERSION"
            echo "\`\`\`"
            echo ""
            echo "### Verify supply-chain attestations:"
            echo "\`\`\`bash"
            echo "gh attestation verify oci://$IMAGE:$VERSION \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --cert-identity https://github.com/${GITHUB_WORKFLOW_REF%@*}@$GITHUB_REF"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
