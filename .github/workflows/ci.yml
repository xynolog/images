name: Image repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer run of the same event on the same ref supersedes an older one. A
# merge queue entry has a ref of its own, so entries never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit of a pull request is signed off by its author (the org's
  # CONTRIBUTING.md).
  dco:
    uses: xynolog/.github/.github/workflows/dco.yml@b3dcbb9f9db37476c2bd259711ebaac6df777fbf

  # On a push to main, the repository's labels become the org's seven.
  labels:
    uses: xynolog/.github/.github/workflows/labels.yml@189966d08e740aa4e79460c9fce7a85769880193
    permissions:
      issues: write

  # Every run gates upstream.lock.json and builds, restores or downloads the
  # SDK bundle, the artifact `sdk-artifacts`: the image builds install from it,
  # and the advisories and crates jobs, which run every time, resolve against
  # it.
  sdk:
    uses: xynolog/sdk/.github/workflows/upstream.yml@52c59e698b3ee821113f350539f521f6c9df6e1d
    with:
      languages: typescript python rust codegen
      release: false

  checks:
    name: Make help and the images this change affects
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Make help lists every public target
        run: python3 build-tools/test_make_help.py --root . --list '<image>=IMAGE_NAMES'

      - name: Every NOTICE credits what its image ships
        run: node scripts/check-notice-components.mjs

      - name: The Rust images share their build stages
        run: node scripts/check-rust-images.mjs

      # An image builds when this change touches one of its inputs (its Dockerfile's
      # copies, its language's shared code, what every build reads). The Rust images
      # share one compile of the Rust workspace, so the affected ones build together;
      # every other image takes seconds, less than a job of its own costs.
      - name: Group the images this change affects
        id: groups
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          groups=$(python3 scripts/changed-images.py "$BASE" "$GITHUB_SHA")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

      - name: Only the broker's implementations name NATS
        run: node scripts/check-broker-boundary.mjs

      - name: Every service image is supervision-capable
        run: bash scripts/audit-supervision.sh

  model-catalogue:
    name: Model catalogue matches its pin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/python/inference
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install the pinned catalogue package
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate and compare
        run: npm run generate:model-catalogue:check

  images:
    name: Build ${{ matrix.group.name }}
    needs: [checks, sdk]
    if: needs.checks.outputs.groups != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.checks.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - uses: docker/setup-buildx-action@v4.4.1
      # A run step has no ACTIONS_RUNTIME_TOKEN or ACTIONS_RESULTS_URL; this
      # exports them, for build-session.sh's buildx to reach GitHub's cache.
      - uses: crazy-max/ghaction-github-runtime@v4.0.0
      - name: Build the group's images
        env:
          IMAGES: ${{ matrix.group.images }}
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make $IMAGES

  # No dependency in any lockfile has a published advisory that advisories.toml
  # does not ignore with a reason, and no ignore outlives its finding
  # (build-tools/advisories.py).
  # The browser package commits no lock; building it from the SDK bundle, as its
  # image does, leaves the lock its install resolved.
  advisories:
    name: No dependency has an advisory nobody judged
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - name: Install osv-scanner
        run: |
          bash build-tools/install-osv-scanner.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve the browser package's lock by building it
        run: bash scripts/build-browser-package.sh "$RUNNER_TEMP/sdk-artifacts"

      - name: Scan every lockfile
        run: python3 build-tools/advisories.py --root . --lockfile .local/browser-lock/package-lock.json

  # cargo-deny's bans and sources checks (packages/rust/deny.toml). Advisories are
  # the advisories job's, with every other lockfile's.
  # The workspace takes the SDK's crates from the bundle, by the patch the Rust
  # images' Dockerfiles install, at the path they put them. The services link
  # those crates, so the environment they read is checked against protocol's
  # table here, where the crates' source is staged.
  crates:
    name: Every crate comes from crates.io, by version, and reads only the environment the table lists
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      - name: Stage the SDK's crates
        run: |
          sudo install -d -o "$USER" /sdk/cargo-local
          python3 scripts/prepare-rust-sdk-artifacts.py "$RUNNER_TEMP/sdk-artifacts" /sdk/cargo-local
          cp /sdk/cargo-local/config.toml "$HOME/.cargo/config.toml"

      - name: Check the workspace's crates
        working-directory: packages/rust
        run: cargo deny --locked check bans sources

      - name: Each Rust service reads exactly the environment protocol's table lists
        run: node scripts/check-service-environment.mjs /sdk/cargo-local

      # Every crate each service binary links, on each platform the images are
      # built for, is under a permitted licence and credited in its image's NOTICE.
      - name: Every crate a service binary links is permitted and credited
        working-directory: packages/rust
        run: |
          mkdir "$RUNNER_TEMP/crates"
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/crates/metadata.json"
          for binary in xynolog-gateway xynolog-dispatcher xynolog-archivist; do
            for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              cargo tree --locked -p "$binary" -e normal,no-proc-macro --target "$target" --prefix none --format '{p}' \
                > "$RUNNER_TEMP/crates/linked-$binary-$target.txt"
            done
          done
          node ../../scripts/check-image-crates.mjs "$RUNNER_TEMP/crates"

  # The committed generated files are what the generator the bundle carries
  # writes from the pinned Protocol (`make check-generated`,
  # scripts/generated.sh).
  generated:
    name: The generated files are what the pinned SDK's generator writes
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - name: Check the generated files
        env:
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make check-generated

  # The Rust workspace's format, lints, tests and dependency boundaries
  # (`make test-rust`, scripts/test-rust.sh), against the SDK's crates from the
  # bundle.
  rust:
    name: The Rust workspace is formatted, lint-free, tested and within its boundaries
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      # The target keeps cargo's registry and target directory here
      # (scripts/test-rust.sh). It is saved even when the checks fail: what
      # compiled is still good, and a failing branch is when the next run
      # comes soonest.
      - name: Restore cargo's registry and target directory
        id: cargo
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog-images/rust
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('packages/rust/rust-toolchain.toml', 'packages/rust/Cargo.lock', 'upstream.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Run the workspace's checks
        env:
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make test-rust

      - name: Save cargo's registry and target directory
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog-images/rust
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # Each Python project's type checks, lints, format and tests (`make
  # test-python`, scripts/test-python.sh), against the SDK's wheel from the
  # bundle.
  python:
    name: The Python projects type-check, are lint-free and formatted, and pass their tests
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      # The target keeps uv's cache here (scripts/test-python.sh). It is saved
      # even when the checks fail: what was downloaded is still good.
      - name: Restore uv's cache
        id: uv
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog-images/python
          key: ${{ runner.os }}-${{ runner.arch }}-python-${{ hashFiles('**/uv.lock', 'sdk.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-python-

      - name: Run each project's checks
        env:
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make test-python

      - name: Save uv's cache
        if: always() && steps.uv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog-images/python
          key: ${{ steps.uv.outputs.cache-primary-key }}

  # The Browser's tests and the type checks of its sources and tests (`make
  # test-browser`, scripts/test-browser.sh), against the SDK's npm packages
  # from the bundle.
  browser:
    name: The Browser passes its tests, and its sources and tests type-check
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - name: Run the Browser's checks
        env:
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make test-browser

  e2e:
    name: E2E's type check and format
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - name: Check E2E
        env:
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make check-e2e

  # What the ruleset requires. It waits for every other job, a census holds
  # that list to the workflow's jobs, and it fails when any of them failed or
  # was cancelled. A job skipped by its own condition passes.
  gate:
    name: CI Gate
    if: always()
    needs: [dco, labels, sdk, checks, model-catalogue, images, advisories, crates, generated, rust, python, browser, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: The gate waits for every other job
        run: |
          jobs="$(yq '.jobs | keys | .[] | select(. != "gate")' .github/workflows/ci.yml | sort)"
          waits="$(yq '.jobs.gate.needs[]' .github/workflows/ci.yml | sort)"
          if [ "$jobs" != "$waits" ]; then
            echo "CI Gate's needs differ from the workflow's jobs (< jobs, > needs):" >&2
            diff <(echo "$jobs") <(echo "$waits") >&2
            exit 1
          fi
      - name: Every job it waits for passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
