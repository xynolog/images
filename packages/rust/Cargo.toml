# The Rust workspace: the services written in Rust and the crates they share.
# One lockfile, one target/ and one toolchain (rust-toolchain.toml) for all of
# them. The desktop app's crate is its own project, outside the workspace.
[workspace]
resolver = "3"
members = [
    "core",
    "http-service",
    "observability",
    "../../archivist",
    "../../archivist/record",
    "../../archivist/staging",
    "../../dispatcher",
    "../../dispatcher/handlers",
    "../../dispatcher/jetstream",
    "../../gateway",
]

# Every crate a member uses, by version, once: a member names the ones it uses
# with `.workspace = true` and adds the features it needs.
[workspace.dependencies]
xynolog = "=1.2611.0-dev.20261120131050.g548e4fb"
xynolog-archivist-record = { path = "../../archivist/record" }
xynolog-archivist-staging = { path = "../../archivist/staging" }
xynolog-dispatcher-handlers = { path = "../../dispatcher/handlers" }
xynolog-dispatcher-jetstream = { path = "../../dispatcher/jetstream" }
xynolog-core = { path = "core" }
xynolog-http-service = { path = "http-service" }
xynolog-http-transport = "=1.2611.0-dev.20261120131050.g548e4fb"
xynolog-observability = { path = "observability" }
xynolog-telemetry = "=1.2611.0-dev.20261120131050.g548e4fb"
async-nats = { version = "0.50.0", default-features = false }
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
http-body = "1.1.0"
hyper = "1.11.1"
hyper-util = "0.1.21"
jiff = { version = "1.0.1", default-features = false }
jsonschema = { version = "0.60.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false }
opentelemetry-stdout = { version = "0.33.0", default-features = false }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
serde-saphyr = "2.0.0"
socket2 = "0.6.5"
tikv-jemalloc-ctl = "0.7.0"
tikv-jemallocator = "0.7.0"
tokio = "1.53.1"
tower = "0.5.3"
unicode-normalization = "0.1.24"
uuid = "1.26.1"

[profile.release]
strip = true
lto = "thin"
